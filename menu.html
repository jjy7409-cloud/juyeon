<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하루온담 - 실시간 가격표/메뉴판 생성기</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="menu.css">
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="images/logo_generated.png" alt="하루온담 로고" onerror="this.src='images/logo1.png'">
                <h1>가격표 생성기</h1>
            </div>

            <!-- Template Select -->
            <div class="control-group">
                <label for="control-template">템플릿 규격</label>
                <select id="control-template">
                    <option value="a4">매장 비치용 / A4 인쇄용</option>
                    <option value="mobile">모바일 공유용 / 인스타 (9:16)</option>
                </select>
            </div>

            <!-- Title & Subtitle -->
            <div class="control-group">
                <label for="control-title">메인 타이틀</label>
                <input type="text" id="control-title" value="하루온담 가격안내">
            </div>
            <div class="control-group">
                <label for="control-subtitle">서브 타이틀</label>
                <input type="text" id="control-subtitle" value="오븐에 구워 정성을 더한 프리미엄 수제 정과 & 오란다">
            </div>

            <!-- Layout Options -->
            <div class="control-group">
                <label>디자인 옵션</label>
                <label class="checkbox-label">
                    <input type="checkbox" id="control-show-images" checked>
                    제품 사진 표시하기
                </label>
            </div>

            <div class="control-group">
                <label for="control-font-size">글자 크기</label>
                <select id="control-font-size">
                    <option value="fs-small">작게 (기본)</option>
                    <option value="fs-medium" selected>중간</option>
                    <option value="fs-large">크게</option>
                </select>
            </div>

            <!-- Notice box text -->
            <div class="control-group">
                <label for="control-notice">공지사항 문구</label>
                <input type="text" id="control-notice" value="대량 주문 및 맞춤 포장은 최소 3~5일 전 문의주시면 정성껏 준비해 드립니다.">
            </div>

            <!-- Footer Contact Details -->
            <div class="control-group">
                <label for="control-contact-phone">연락처</label>
                <input type="text" id="control-contact-phone" value="010-XXXX-XXXX">
            </div>
            <div class="control-group">
                <label for="control-contact-insta">인스타그램</label>
                <input type="text" id="control-contact-insta" value="@haruondam">
            </div>
            <div class="control-group">
                <label for="control-contact-kakao">카카오톡</label>
                <input type="text" id="control-contact-kakao" value="하루온담">
            </div>

            <!-- Interactive Price Editor Section -->
            <div class="control-group" style="margin-top: 10px;">
                <label style="border-bottom: 1.5px solid var(--primary); padding-bottom: 4px; margin-bottom: 5px;">실시간 가격 수정</label>
                <div style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;" id="price-editor-list">
                    <!-- Dynamic fields will be populated by JS -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btn-download-image">
                    <i class="fa-solid fa-file-image"></i> 이미지로 저장 (PNG)
                </button>
                <button type="button" class="btn btn-secondary" id="btn-print">
                    <i class="fa-solid fa-print"></i> 가격표 인쇄하기 (PDF)
                </button>
                <a href="index.html" class="btn btn-outline" style="text-decoration: none;">
                    <i class="fa-solid fa-house"></i> 메인 홈으로 이동
                </a>
            </div>
        </aside>

        <!-- Preview Area -->
        <main class="preview-workspace">
            <div class="menu-board-wrapper template-a4 fs-medium" id="menu-board">
                <div class="menu-border-outer">
                    <div class="ornament ornament-tl"></div>
                    <div class="ornament ornament-tr"></div>
                    <div class="ornament ornament-bl"></div>
                    <div class="ornament ornament-br"></div>
                    
                    <div class="menu-border-inner">
                        <!-- Header -->
                        <header class="menu-header">
                            <span class="menu-header-badge">100% HANDMADE & OVEN BAKED</span>
                            <div class="menu-title-container">
                                <h1 class="menu-main-title" id="preview-title">하루온담 가격안내</h1>
                                <span class="menu-subtitle" id="preview-subtitle">오븐에 구워 정성을 더한 프리미엄 수제 정과 & 오란다</span>
                            </div>
                        </header>

                        <!-- Content Grid -->
                        <div class="menu-content-grid" id="preview-content-grid">
                            
                            <!-- Column 1: Jeonggwa & Single Items -->
                            <div class="menu-category" data-cat="jeonggwa">
                                <div class="category-title-wrap">
                                    <span class="category-icon"><i class="fa-solid fa-mortar-pestle"></i></span>
                                    <h2 class="category-title">수제 정과류</h2>
                                    <span class="category-icon"><i class="fa-solid fa-mortar-pestle"></i></span>
                                </div>
                                <div class="menu-items-list" id="list-jeonggwa">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>

                            <!-- Column 2: Oranda & Gift Sets -->
                            <div class="menu-category" data-cat="oranda">
                                <div class="category-title-wrap">
                                    <span class="category-icon"><i class="fa-solid fa-cookie-bite"></i></span>
                                    <h2 class="category-title">수제 오란다 & 세트</h2>
                                    <span class="category-icon"><i class="fa-solid fa-cookie-bite"></i></span>
                                </div>
                                <div class="menu-items-list" id="list-oranda">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>

                        </div>

                        <!-- Bottom Notice -->
                        <div class="menu-notice-box" id="preview-notice-box">
                            <strong>[안내]</strong> <span id="preview-notice">대량 주문 및 맞춤 포장은 최소 3~5일 전 문의주시면 정성껏 준비해 드립니다.</span>
                        </div>

                        <!-- Footer Contacts -->
                        <footer class="menu-footer">
                            <div class="footer-info-item">
                                <i class="fa-solid fa-phone"></i>
                                <span id="preview-phone">010-XXXX-XXXX</span>
                            </div>
                            <div class="footer-info-item">
                                <i class="fa-brands fa-instagram"></i>
                                <span id="preview-insta">@haruondam</span>
                            </div>
                            <div class="footer-info-item">
                                <i class="fa-solid fa-comment"></i>
                                <span>카카오톡: <strong id="preview-kakao">하루온담</strong></span>
                            </div>
                        </footer>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Main JavaScript -->
    <script src="menu.js"></script>
</body>
</html>
